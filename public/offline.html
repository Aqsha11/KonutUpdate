<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Konut.Update</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #F8FAFC; color: #1F2937; text-align: center; padding: 24px;
        }
        .offline-card {
            max-width: 420px; padding: 48px 40px;
            background: #fff; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        .icon {
            width: 80px; height: 80px; border-radius: 24px;
            background: linear-gradient(135deg, #189B39, #0D6B2A);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px; font-size: 2.5rem; font-weight: 900; color: #fff;
        }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
        p { color: #6B7280; font-size: 0.95rem; line-height: 1.6; margin-bottom: 32px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 28px; background: #189B39; color: #fff;
            border: none; border-radius: 12px; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; text-decoration: none; transition: all 0.2s;
        }
        .btn:hover { background: #147A2E; transform: translateY(-1px); }
        .status { font-size: 0.78rem; color: #9CA3AF; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon">K</div>
        <h1>Koneksi Terputus</h1>
        <p>Sepertinya Anda sedang offline. Periksa kembali koneksi internet Anda untuk melanjutkan membaca berita terbaru dari Konut.Update.</p>
        <button class="btn" onclick="window.location.reload()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Coba Lagi
        </button>
        <p class="status">Konut.Update &mdash; Portal Berita Konawe Utara</p>
    </div>
</body>
</html>
