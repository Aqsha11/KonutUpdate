services:
  - type: web
    name: konut-update
    runtime: php
    buildCommand: composer install --no-dev --optimize-autoloader && npm ci && npm run build && php artisan migrate --force && php artisan db:seed --class=CategorySeeder --force && php artisan db:seed --class=PageSeeder --force && php artisan storage:link --force && php artisan optimize
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: konut-update
          propertyUrl: url
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: konut-db
          propertyUrl: host
      - key: DB_PORT
        fromDatabase:
          name: konut-db
          propertyUrl: port
      - key: DB_DATABASE
        fromDatabase:
          name: konut-db
          propertyUrl: database
      - key: DB_USERNAME
        fromDatabase:
          name: konut-db
          propertyUrl: user
      - key: DB_PASSWORD
        fromDatabase:
          name: konut-db
          propertyUrl: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_LIFETIME
        value: "120"
      - key: TRUST_PROXIES
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: NODE_VERSION
        value: "20"
    disk:
      name: storage
      mountPath: /opt/render/project/storage
      sizeGB: 1

  - type: worker
    name: konut-worker
    runtime: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: sh -c 'php artisan queue:work --sleep=3 --tries=3 & php artisan schedule:work'
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: konut-db
          propertyUrl: host
      - key: DB_PORT
        fromDatabase:
          name: konut-db
          propertyUrl: port
      - key: DB_DATABASE
        fromDatabase:
          name: konut-db
          propertyUrl: database
      - key: DB_USERNAME
        fromDatabase:
          name: konut-db
          propertyUrl: user
      - key: DB_PASSWORD
        fromDatabase:
          name: konut-db
          propertyUrl: password
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: konut-db
    plan: free
    databaseName: konut_update
